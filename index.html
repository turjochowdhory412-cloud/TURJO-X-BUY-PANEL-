<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TURJO X — Face Lock</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top,#18204a,#080b18 48%,#03040a);
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
}

.container{
  width:100%;
  max-width:430px;
  text-align:center;
}

.logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:3px;
}

.sub{
  color:#9ca3af;
  margin:7px 0 18px;
}

.camera{
  position:relative;
  width:100%;
  aspect-ratio:3/4;
  overflow:hidden;
  border-radius:24px;
  background:#000;
  border:2px solid #26304f;
  box-shadow:0 0 35px rgba(70,100,255,.25);
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

.scan{
  position:absolute;
  left:18%;
  right:18%;
  top:18%;
  bottom:18%;
  border:2px solid rgba(0,255,255,.7);
  border-radius:50%;
  box-shadow:0 0 25px rgba(0,255,255,.2);
  pointer-events:none;
}

.status{
  min-height:52px;
  margin:16px 0;
  padding:14px;
  border-radius:14px;
  background:#101526;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
}

.green{
  color:#22c55e;
}

.red{
  color:#ef4444;
}

button{
  width:100%;
  border:0;
  padding:14px;
  margin-top:9px;
  border-radius:13px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
}

button:disabled{
  opacity:.45;
}

.reset{
  background:#252b3d;
}

.hidden{
  display:none!important;
}

#app{
  margin-top:18px;
  padding:24px;
  border-radius:20px;
  background:#101827;
  border:1px solid #293650;
}

.access{
  font-size:23px;
  font-weight:900;
  margin-bottom:10px;
}

.setting{
  text-align:left;
  margin-top:18px;
}

.setting label{
  display:block;
  margin-bottom:7px;
  color:#cbd5e1;
}

input[type=range]{
  width:100%;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">TURJO X</div>
  <div class="sub">FACE LOCK SECURITY</div>

  <div class="camera">
    <video id="video" autoplay muted playsinline></video>
    <div class="scan"></div>
  </div>

  <div id="status" class="status">
    Requesting camera permission...
  </div>

  <button id="registerBtn">
    REGISTER OWNER FACE
  </button>

  <button id="verifyBtn" disabled>
    VERIFY FACE
  </button>

  <button id="resetBtn" class="reset">
    RESET OWNER FACE
  </button>

  <div id="app" class="hidden">

    <div class="access green">
      ACCESS GRANTED ✓
    </div>

    <p>TURJO X Sensitivity</p>

    <div class="setting">
      <label>General Sensitivity</label>
      <input type="range" min="0" max="200" value="100">
    </div>

    <div class="setting">
      <label>Red Dot</label>
      <input type="range" min="0" max="200" value="90">
    </div>

    <div class="setting">
      <label>2x Scope</label>
      <input type="range" min="0" max="200" value="85">
    </div>

    <div class="setting">
      <label>4x Scope</label>
      <input type="range" min="0" max="200" value="75">
    </div>

  </div>

</div>

<script>

const video = document.getElementById("video");
const statusBox = document.getElementById("status");
const registerBtn = document.getElementById("registerBtn");
const verifyBtn = document.getElementById("verifyBtn");
const resetBtn = document.getElementById("resetBtn");
const app = document.getElementById("app");

const STORAGE_KEY = "TURJO_X_OWNER_FACE";

const MODEL_URL =
"https://justadudewhohacks.github.io/face-api.js/models";

let modelsLoaded = false;
let cameraReady = false;
let busy = false;


// ============================
// STATUS
// ============================

function setStatus(message,type="normal"){

  statusBox.textContent = message;

  statusBox.classList.remove(
    "green",
    "red"
  );

  if(type === "green"){
    statusBox.classList.add("green");
  }

  if(type === "red"){
    statusBox.classList.add("red");
  }
}


// ============================
// LOAD FACE MODELS
// ============================

async function loadModels(){

  setStatus("Loading face recognition...");

  try{

    await faceapi.nets.tinyFaceDetector
      .loadFromUri(MODEL_URL);

    await faceapi.nets.faceLandmark68Net
      .loadFromUri(MODEL_URL);

    await faceapi.nets.faceRecognitionNet
      .loadFromUri(MODEL_URL);

    modelsLoaded = true;

    setStatus("Face system ready.");

  }catch(error){

    console.error(error);

    setStatus(
      "Face model loading failed.",
      "red"
    );
  }
}


// ============================
// CAMERA
// ============================

async function startCamera(){

  if(!navigator.mediaDevices ||
     !navigator.mediaDevices.getUserMedia){

    setStatus(
      "Camera is not supported here.",
      "red"
    );

    return;
  }

  try{

    /*
      Browser will show the Android
      camera permission dialog.
    */

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user",
          width:{ideal:640},
          height:{ideal:480}
        },

        audio:false

      });

    video.srcObject = stream;

    cameraReady = true;

    verifyBtn.disabled = false;

    setStatus(
      "Camera ready — show your face."
    );

  }catch(error){

    console.error(error);

    setStatus(
      "Camera permission was not allowed.",
      "red"
    );
  }
}


// ============================
// GET WHOLE FACE DESCRIPTOR
// ============================

async function getFaceDescriptor(){

  if(!modelsLoaded || !cameraReady){
    return null;
  }

  /*
    Access decision is based on the
    complete face descriptor.
    No eye-only / finger / voice check.
  */

  const result =
    await faceapi
      .detectSingleFace(
        video,
        new faceapi.TinyFaceDetectorOptions({
          inputSize:320,
          scoreThreshold:0.5
        })
      )
      .withFaceLandmarks()
      .withFaceDescriptor();

  if(!result){
    return null;
  }

  return result.descriptor;
}


// ============================
// FACE DISTANCE
// ============================

function faceDistance(a,b){

  let total = 0;

  for(let i=0;i<a.length;i++){

    const difference =
      a[i] - b[i];

    total +=
      difference * difference;
  }

  return Math.sqrt(total);
}


// ============================
// REGISTER OWNER
// ============================

registerBtn.addEventListener(
  "click",
  async function(){

    if(busy) return;

    busy = true;
    registerBtn.disabled = true;

    try{

      const existing =
        localStorage.getItem(STORAGE_KEY);

      if(existing){

        setStatus(
          "Owner already registered. Reset first.",
          "red"
        );

        return;
      }

      setStatus(
        "Detecting your face..."
      );

      const descriptor =
        await getFaceDescriptor();

      if(!descriptor){

        setStatus(
          "No face detected. Look at the camera.",
          "red"
        );

        return;
      }

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
          Array.from(descriptor)
        )
      );

      setStatus(
        "OWNER FACE REGISTERED ✓",
        "green"
      );

    }catch(error){

      console.error(error);

      setStatus(
        "Owner registration failed.",
        "red"
      );

    }finally{

      busy = false;
      registerBtn.disabled = false;
    }

  }
);


// ============================
// VERIFY FACE
// ============================

verifyBtn.addEventListener(
  "click",
  async function(){

    if(busy) return;

    busy = true;
    verifyBtn.disabled = true;

    app.classList.add("hidden");

    try{

      const saved =
        localStorage.getItem(STORAGE_KEY);

      if(!saved){

        setStatus(
          "No owner face registered.",
          "red"
        );

        return;
      }

      setStatus(
        "Matching owner face..."
      );

      const ownerDescriptor =
        new Float32Array(
          JSON.parse(saved)
        );

      const currentDescriptor =
        await getFaceDescriptor();

      if(!currentDescriptor){

        setStatus(
          "No face detected.",
          "red"
        );

        return;
      }

      const distance =
        faceDistance(
          ownerDescriptor,
          currentDescriptor
        );

      console.log(
        "Face match distance:",
        distance
      );

      /*
        Smaller distance means
        the faces are more similar.
      */

      const MATCH_THRESHOLD = 0.50;

      if(distance < MATCH_THRESHOLD){

        setStatus(
          "ACCESS GRANTED ✓",
          "green"
        );

        app.classList.remove("hidden");

      }else{

        setStatus(
          "ACCESS DENIED ✕",
          "red"
        );

        app.classList.add("hidden");
      }

    }catch(error){

      console.error(error);

      setStatus(
        "Face verification error.",
        "red"
      );

    }finally{

      busy = false;
      verifyBtn.disabled = false;
    }

  }
);


// ============================
// RESET OWNER
// ============================

resetBtn.addEventListener(
  "click",
  function(){

    const confirmReset =
      confirm(
        "Reset the registered owner face?"
      );

    if(!confirmReset) return;

    localStorage.removeItem(
      STORAGE_KEY
    );

    app.classList.add("hidden");

    setStatus(
      "Owner face reset. Register again."
    );
  }
);


// ============================
// AUTO START
// ============================

(async function(){

  await loadModels();

  if(modelsLoaded){

    /*
      Camera permission is requested
      automatically when the page loads.
    */

    await startCamera();
  }

})();

</script>

</body>
</html>
