<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENSI Social - Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* আপনার কাকাসির ছবির নাম এখানে ঠিকমতো বসিয়ে দিন */
            background-image: url('kakashi.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
        }

        .login-box {
            background: rgba(0, 0, 0, 0.8);
            padding: 25px;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            color: #fff;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ff4757;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #222;
            color: #fff;
            box-sizing: border-box;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            background: #ff4757;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .login-btn:hover {
            background: #ff6b81;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>SENSI Social</h2>
        <form>
            <div class="input-group">
                <label>ইমেইল বা ইউজারনেম</label>
                <input type="text" placeholder="আপনার নাম দিন" required>
            </div>
            <div class="input-group">
                <label>পাসওয়ার্ড</label>
                <input type="password" placeholder="পাসওয়ার্ড দিন" required>
            </div>
            <button type="submit" class="login-btn">লগইন করুন</button>
        </form>
    </div>

</body>
</html>
